name: Update terminal session

# Refreshes the contribution candles daily from the public calendar.
# Standard library only — no tokens, no third-party services.

"on":
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/render_session.py'
      - 'scripts/fetch_contributions.py'
      - 'scripts/fetch_languages.py'
      - 'data/profile-note.md'
      - 'data/profile.md'
      - 'tests/test_profile.py'
      - '.github/workflows/update-profile-art.yml'

permissions:
  contents: write

concurrency:
  group: profile-session
  cancel-in-progress: false

env:
  GH_PROFILE_USER: alefkaue

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test language totals and editorial profile persistence
        run: python -m unittest discover -s tests -v
      - name: Fetch public contribution calendar
        run: python scripts/fetch_contributions.py
      - name: Aggregate public repo languages
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_languages.py
      - name: Render current session
        run: python scripts/render_session.py
      - name: Commit refreshed activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data assets/session README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh terminal session activity [skip ci]'
          git push
