<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-labelledby="title desc"><title id="title">alefkaue — language byte share across public repositories</title><desc id="desc">Monochrome bars of the top languages by bytes across 30 public, non-fork repositories: Python 41.9%, TypeScript 41.5%, JavaScript 6.0%, HTML 4.6%, CSS 2.5%, Bicep 1.4%, Other 2.1%.</desc><style>
@keyframes type{0%{clip-path:inset(0 100% 0 0)}6%{clip-path:inset(0 0 0 0)}90%{clip-path:inset(0 0 0 0)}94%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes enter{0%{opacity:0}6%{opacity:1}90%{opacity:1}94%{opacity:0}100%{opacity:0}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes cursor{50%{opacity:0}}
@keyframes grow{0%{clip-path:inset(0 100% 0 0)}12%{clip-path:inset(0 100% 0 0)}44%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
.type{animation:type 18s linear infinite}
.output{animation:enter 18s linear infinite}
.pop{animation:pop .5s both}
.grow{animation:grow 18s linear infinite}
.cursor{animation:cursor 1s step-end infinite}
@media(prefers-reduced-motion:reduce){.type,.output,.pop,.grow,.cursor{animation:none}.type,.grow{clip-path:inset(0 0 0 0)}.output,.pop{opacity:1}}
</style><text x="32" y="39" font-family="monospace" font-size="17" font-weight="400" fill="#1f2328">~ $ git languages --top</text><text x="32" y="70" font-family="monospace" font-size="11" font-weight="400" fill="#59636e">BYTE SHARE / 30 PUBLIC REPOS / FORKS EXCLUDED</text><rect x="32" y="86" width="896" height="1" fill="#d1d9e0" stroke="none" stroke-width="0"/><text x="32" y="117" font-family="monospace" font-size="14" font-weight="400" fill="#1f2328">Python</text><rect x="176" y="103" width="592" height="16" fill="#d8dee4" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:0.30s" x="176" y="103" width="248.0" height="16" fill="#1f2328"/><text x="786" y="117" font-family="monospace" font-size="13" font-weight="400" fill="#1f2328">41.9%</text><text x="32" y="161" font-family="monospace" font-size="14" font-weight="400" fill="#1f2328">TypeScript</text><rect x="176" y="147" width="592" height="16" fill="#d8dee4" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:0.48s" x="176" y="147" width="245.7" height="16" fill="#1f2328"/><text x="786" y="161" font-family="monospace" font-size="13" font-weight="400" fill="#1f2328">41.5%</text><text x="32" y="205" font-family="monospace" font-size="14" font-weight="400" fill="#1f2328">JavaScript</text><rect x="176" y="191" width="592" height="16" fill="#d8dee4" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:0.66s" x="176" y="191" width="35.5" height="16" fill="#1f2328"/><text x="786" y="205" font-family="monospace" font-size="13" font-weight="400" fill="#1f2328">6.0%</text><text x="32" y="249" font-family="monospace" font-size="14" font-weight="400" fill="#1f2328">HTML</text><rect x="176" y="235" width="592" height="16" fill="#d8dee4" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:0.84s" x="176" y="235" width="27.2" height="16" fill="#1f2328"/><text x="786" y="249" font-family="monospace" font-size="13" font-weight="400" fill="#1f2328">4.6%</text><text x="32" y="293" font-family="monospace" font-size="14" font-weight="400" fill="#1f2328">CSS</text><rect x="176" y="279" width="592" height="16" fill="#d8dee4" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:1.02s" x="176" y="279" width="14.8" height="16" fill="#1f2328"/><text x="786" y="293" font-family="monospace" font-size="13" font-weight="400" fill="#1f2328">2.5%</text><text x="32" y="337" font-family="monospace" font-size="14" font-weight="400" fill="#1f2328">Bicep</text><rect x="176" y="323" width="592" height="16" fill="#d8dee4" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:1.20s" x="176" y="323" width="8.3" height="16" fill="#1f2328"/><text x="786" y="337" font-family="monospace" font-size="13" font-weight="400" fill="#1f2328">1.4%</text><text x="32" y="381" font-family="monospace" font-size="14" font-weight="400" fill="#1f2328">Other</text><rect x="176" y="367" width="592" height="16" fill="#d8dee4" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:1.38s" x="176" y="367" width="12.4" height="16" fill="#1f2328"/><text x="786" y="381" font-family="monospace" font-size="13" font-weight="400" fill="#1f2328">2.1%</text></svg>
