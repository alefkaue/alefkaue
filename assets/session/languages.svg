<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-labelledby="title desc"><title id="title">alefkaue — language byte share across public repositories</title><desc id="desc">Monochrome bars of the top languages by bytes across 27 public, non-fork repositories: Python 47.5%, TypeScript 29.0%, JavaScript 11.9%, HTML 4.2%, CSS 4.0%, Bicep 1.2%, Other 2.2%.</desc><style>
@keyframes type{0%{clip-path:inset(0 100% 0 0)}6%{clip-path:inset(0 0 0 0)}90%{clip-path:inset(0 0 0 0)}94%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes enter{0%{opacity:0}6%{opacity:1}90%{opacity:1}94%{opacity:0}100%{opacity:0}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes cursor{50%{opacity:0}}
@keyframes grow{0%{clip-path:inset(0 100% 0 0)}12%{clip-path:inset(0 100% 0 0)}44%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
.type{animation:type 18s linear infinite}
.output{animation:enter 18s linear infinite}
.pop{animation:pop .5s both}
.grow{animation:grow 18s linear infinite}
.cursor{animation:cursor 1s step-end infinite}
@media(prefers-reduced-motion:reduce){.type,.output,.pop,.grow,.cursor{animation:none}.type,.grow{clip-path:inset(0 0 0 0)}.output,.pop{opacity:1}}
</style><text x="32" y="39" font-family="monospace" font-size="17" font-weight="400" fill="#f0f0f0">~ $ git languages --top</text><text x="32" y="70" font-family="monospace" font-size="11" font-weight="400" fill="#969696">BYTE SHARE / 27 PUBLIC REPOS / FORKS EXCLUDED</text><rect x="32" y="86" width="896" height="1" fill="#393939" stroke="none" stroke-width="0"/><text x="32" y="117" font-family="monospace" font-size="14" font-weight="400" fill="#f0f0f0">Python</text><rect x="176" y="103" width="592" height="16" fill="#252525" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:0.30s" x="176" y="103" width="281.2" height="16" fill="#f0f0f0"/><text x="786" y="117" font-family="monospace" font-size="13" font-weight="400" fill="#f0f0f0">47.5%</text><text x="32" y="161" font-family="monospace" font-size="14" font-weight="400" fill="#f0f0f0">TypeScript</text><rect x="176" y="147" width="592" height="16" fill="#252525" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:0.48s" x="176" y="147" width="171.7" height="16" fill="#f0f0f0"/><text x="786" y="161" font-family="monospace" font-size="13" font-weight="400" fill="#f0f0f0">29.0%</text><text x="32" y="205" font-family="monospace" font-size="14" font-weight="400" fill="#f0f0f0">JavaScript</text><rect x="176" y="191" width="592" height="16" fill="#252525" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:0.66s" x="176" y="191" width="70.4" height="16" fill="#f0f0f0"/><text x="786" y="205" font-family="monospace" font-size="13" font-weight="400" fill="#f0f0f0">11.9%</text><text x="32" y="249" font-family="monospace" font-size="14" font-weight="400" fill="#f0f0f0">HTML</text><rect x="176" y="235" width="592" height="16" fill="#252525" stroke="none" stroke-width="0"/><rect class="grow" style="animation-delay:0.84s" x="176" y="235" width="24.9" height="16" fill="#f0f0f0"/><text x="786" y="249" font-family="monospace" font-size="13" font-weight="400" fill="#f0f0