<svg xmlns="http://www.w3.org/2000/svg" width="960" height="676" viewBox="0 0 960 676" role="img" aria-labelledby="title desc"><title id="title">ALEFKAUE — a living terminal session</title><desc id="desc">Animated connection and whoami sequence. Alef Santos / alefkaue — Estudante de TI; Segurança da Informação &amp; Dev. Project links and an expandable stack follow.</desc><style>
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes enter{from{opacity:0}to{opacity:1}}
@keyframes cursor{50%{opacity:0}}
.type{animation:type 1.1s steps(34,end) both}
.output{animation:enter .5s both}
.cursor{animation:cursor 1s step-end infinite}
@media(prefers-reduced-motion:reduce){.type,.output,.cursor{animation:none}}
</style><text x="32" y="35" font-family="monospace" font-size="11" font-weight="400" fill="#1f2328">●  PUBLIC SESSION</text><text x="733" y="35" font-family="monospace" font-size="11" font-weight="400" fill="#1f2328">TTY / 001   UTF-8</text><rect x="32" y="53" width="896" height="1" fill="#d1d9e0" stroke="none" stroke-width="0"/><text x="27" y="142" font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="700" fill="#1f2328">ALEFKAUE</text><text x="33" y="177" font-family="monospace" font-size="12" font-weight="400" fill="#1f2328">LEARNING SECURITY, ONE COMMIT AT A TIME.</text><g class="type" style="animation-delay:0s"><text x="34" y="232" font-family="monospace" font-size="16" font-weight="400" fill="#1f2328">~ $ ssh alefkaue@github</text></g><g class="output" style="animation-delay:1.2s"><text x="34" y="262" font-family="monospace" font-size="12" font-weight="400" fill="#59636e">Connection established. Welcome to my corner.</text></g><g class="type" style="animation-delay:1.8s"><text x="34" y="310" font-family="monospace" font-size="16" font-weight="400" fill="#1f2328">~ $ whoami --verbose</text></g><g class="output" style="animation-delay:3.0s"><text x="34" y="351" font-family="monospace" font-size="12" font-weight="400" fill="#59636e">user</text><text x="135" y="351" font-family="monospace" font-size="12" font-weight="400" fill="#1f2328">Alef Santos / alefkaue</text></g><g class="output" style="animation-delay:3.2s"><text x="34" y="379" font-family="monospace" font-size="12" font-weight="400" fill="#59636e">role</text><text x="135" y="379" font-family="monospace" font-size="12" font-weight="400" fill="#1f2328">Estudante de TI</text></g><g class="output" style="animation-delay:3.4s"><text x="34" y="407" font-family="monospace" font-size="12" font-weight="400" fill="#59636e">focus</text><text x="135" y="407" font-family="monospace" font-size="12" font-weight="400" fill="#1f2328">Segurança da Informação &amp; Dev</text></g><g class="output" style="animation-delay:3.6s"><text x="34" y="435" font-family="monospace" font-size="12" font-weight="400" fill="#59636e">mindset</text><text x="135" y="435" font-family="monospace" font-size="12" font-weight="400" fill="#1f2328">Learn. Break. Defend.</text></g><g class="output" style="animation-delay:3.8s"><text x="34" y="463" font-family="monospace" font-size="12" font-weight="400" fill="#59636e">source</text><text x="135" y="463" font-family="monospace" font-size="12" font-weight="400" fill="#1f2328">Open source. Always curious.</text></g><g class="type" style="animation-delay:4.6s"><text x="34" y="525" font-family="monospace" font-size="16" font-weight="400" fill="#1f2328">~ $ ./explore</text></g><g class="output" style="animation-delay:5.4s"><text x="34" y="556" font-family="monospace" font-size="13" font-weight="400" fill="#59636e">projects/      stack.json      activity.log</text></g><g class="output" style="animation-delay:5.8s"><text x="34" y="596" font-family="monospace" font-size="16" font-weight="400" fill="#1f2328">~ $</text><rect class="cursor" x="77" y="582" width="10" height="18" fill="#1f2328"/></g><rect x="32" y="622" width="896" height="1" fill="#d1d9e0" stroke="none" stroke-width="0"/><text x="34" y="650" font-family="monospace" font-size="11" font-weight="400" fill="#59636e">END OF BOOT / YOUR NEXT COMMAND IS BELOW ↓</text></svg>
